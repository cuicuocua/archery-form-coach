<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Archery Form Coach</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ?debug diagnostic panel — a direct child of <body>, not of #stage, so a two-column
       body.debug-mode grid layout (see style.css) can put it in its own 40% column with #stage
       (camera + skeleton) in the other 60% column, per the owner's brief: "cut the space
       vertically in 2 pieces". It stays display:none (via .hidden, only ever removed when
       ?debug is in the URL — see app.js) in every other build, so this move changes nothing
       about normal (non-debug) behaviour or layout. Its content is built once at startup
       (buildDebugPanel in app.js) and only text/classes are touched after that. -->
  <div id="debug" class="hidden"></div>
  <!-- ?triggertest — live single-trigger inspector. Same sibling-of-#stage trick as #debug above
       (see body.triggertest-mode in style.css): a 40%/60% grid puts this panel on the left and
       the real camera+skeleton (#stage, unchanged) on the right. Stays display:none via .hidden
       unless ?triggertest is in the URL (see app.js), so it changes nothing about normal or
       ?debug behaviour. Built once at startup (buildTriggerTestPanel in app.js); after that only
       text/classes on its existing nodes are touched (renderCurrentTrigger). -->
  <div id="triggertest" class="hidden"></div>
  <div id="stage">
    <div id="camerabox">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="cue"></div>

    <div id="status">Starting camera…</div>
    <!-- PROVISIONAL — HANDOVER.md Stage 4 calibration/framing status line, set automatically by
         app.js (no button — it's captured passively while the archer stands calmly in frame).
         Belongs on Stage 3's future Setup screen once that's built; relocate rather than
         duplicate it there. -->
    <div id="calibration-status" class="hidden"></div>
    <div id="shotlog" class="hidden">
      <div id="shotlog-header">
        <button type="button" id="shotlog-share">⇪ Share</button>
        <button type="button" id="shotlog-close">✕ Close</button>
      </div>
      <textarea id="shotlog-sharetext" class="hidden" readonly></textarea>
      <div id="shotlog-content"></div>
    </div>

    <div id="clipplayer" class="hidden">
      <video id="clipplayer-video" playsinline controls></video>
      <div id="clipplayer-controls">
        <button type="button" class="clipplayer-rate active" data-rate="1">1×</button>
        <button type="button" class="clipplayer-rate" data-rate="0.5">0.5×</button>
        <button type="button" class="clipplayer-rate" data-rate="0.25">0.25×</button>
        <button type="button" id="clipplayer-close">✕ Close</button>
      </div>
    </div>

    <div id="readouts">
      <div class="readout" id="readout-bowarm">
        <div class="label">Bow-arm line</div>
        <div class="value" id="value-bowarm">—</div>
      </div>
      <div class="readout" id="readout-shoulders">
        <div class="label">Shoulder drop</div>
        <div class="shoulder-pair">
          <div class="shoulder-side">
            <span class="side-label">Bow</span>
            <span class="value" id="value-shoulder-bow">—</span>
          </div>
          <div class="shoulder-side">
            <span class="side-label">Draw</span>
            <span class="value" id="value-shoulder-draw">—</span>
          </div>
        </div>
      </div>
      <div class="readout" id="readout-elbow">
        <div class="label">Elbow ↔ arrow line</div>
        <div class="value" id="value-elbow">—</div>
      </div>
    </div>

    <div id="controls">
      <button id="btn-camera" title="Switch camera">🔄 Camera</button>
      <button id="btn-hand" title="Switch handedness">🎯 Right-handed</button>
      <button id="btn-mirror" title="Mirror the view left-right">🪞 Not mirrored</button>
      <button id="btn-log" title="Shot log">📋 Log</button>
    </div>
  </div>

  <!-- app.js is loaded through this tiny bootstrap, not a plain <script type="module" src="app.js">,
       so the ?triggertest panel's "Hard reload" button (see buildTriggerTestPanel in app.js) can
       genuinely bust the cache. ES modules are cached per exact URL, and a query string on THIS
       page (index.html) does nothing to the separate URL app.js is fetched from — a plain reload,
       even a forced one, can still hand back a stale cached module (see CLAUDE.md's Testing
       section, "ES modules cache per origin"). Reading a `cb` param off our OWN url and forwarding
       it onto app.js's own src is what actually changes app.js's URL, which is the only thing that
       guarantees a real network fetch instead of a cache hit. No `cb` param (the normal case, every
       load that isn't the hard-reload button) means app.js is requested exactly as before —
       ordinary caching still applies, nothing about normal use changes. -->
  <script>
    (function () {
      var cb = new URLSearchParams(location.search).get("cb");
      var s = document.createElement("script");
      s.type = "module";
      s.src = "app.js" + (cb ? "?cb=" + encodeURIComponent(cb) : "");
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
